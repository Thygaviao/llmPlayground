# =================================================================
# LLM Assessor Playground - Docker Compose
# =================================================================

services:
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-eval-trainer
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-http://localhost:4000/}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-}
      - LITELLM_MODEL=${LITELLM_MODEL:-qwen/qwen3-coder-next}
    volumes:
      # Постоянное хранилище базы SQLite: разметки сохраняются при перезапусках контейнера
      - ./train.db:/app/train.db
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/').getcode() == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
